<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Secret Valentine</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#ff4d6d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="stylesheet" href="/assets/styles.css" />
</head>

<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="topbar__title">
        <span class="emoji">💌</span>
        <span id="screenTitle">Secret Valentine</span>
      </div>
      <button id="topbarAction" class="topbar__action" type="button" aria-label="Action" hidden>⋯</button>
    </header>

    <main id="view" class="view" role="main" aria-live="polite">
      <!-- Rendered by app.js -->
    </main>

    <nav class="tabbar" aria-label="Bottom Navigation">
      <a class="tabbar__item" href="#/inbox" data-route="inbox" aria-label="Inbox">
        <span class="tabbar__icon">📥</span>
        <span class="tabbar__label">Inbox</span>
      </a>

      <a class="tabbar__item" href="#/compose" data-route="compose" aria-label="Compose">
        <span class="tabbar__icon">✍️</span>
        <span class="tabbar__label">Compose</span>
      </a>

      <a class="tabbar__item" href="#/settings" data-route="settings" aria-label="Settings">
        <span class="tabbar__icon">⚙️</span>
        <span class="tabbar__label">Settings</span>
      </a>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
